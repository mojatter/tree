version: "2"

run:
  timeout: 5m

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - gosec
  settings:
    gosec:
      excludes:
        - G104  # overlaps with errcheck
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
      # staticcheck flags SA5011 after an `if x == nil { t.Fatal() }` check, depending on the lint cache (golangci/golangci-lint#5979).
      - path: _test\.go
        linters:
          - staticcheck
        text: SA5011

formatters:
  enable:
    - gofmt

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
